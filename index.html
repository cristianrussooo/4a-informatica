<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>4A Informatica - Home</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f6f8fa;color:#111}
  header{background:#0078ff;color:#fff;padding:16px;text-align:center;font-size:1.2rem}
  main{padding:16px;max-width:800px;margin:auto}
  .ticketItem{background:#fff;padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.08);margin-bottom:12px}
  input,textarea{width:100%;padding:6px;margin:4px 0;border-radius:6px;border:1px solid #ccc}
  button{padding:6px 10px;margin:4px;border:none;border-radius:6px;cursor:pointer;background:#0078ff;color:#fff}
  .comment{margin-left:12px;padding:4px;border-left:2px solid #0078ff;font-size:13px;color:#333}
</style>
</head>
<body>
<header>Segnala Bug / Idea</header>
<main>
  <h3>Invia richiesta</h3>
  <input id="name" placeholder="Nome" />
  <input id="email" placeholder="Email" />
  <textarea id="message" placeholder="Messaggio o idea..."></textarea>
  <button id="sendTicketBtn">Invia richiesta</button>

<p>La home non è ancora disponibile. Tuttavia, è presente questo form per suggerire idee di impostazione e di grafica, o per segnalare bug (ovviamente va sempre riportato).</p>
        <h3>Tutti i ticket</h3>
  <div id="ticketsList">
    <p>Caricamento ticket...</p>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, push, get, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBj1gIrPyg7r3CGXn7QdUNN6WqU-X93ZeA",
  authDomain: "classe4a-game.firebaseapp.com",
  databaseURL: "https://classe4a-game-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "classe4a-game",
  storageBucket: "classe4a-game.appspot.com",
  messagingSenderId: "558916476831",
  appId: "1:558916476831:web:88bcc4aa4aeb092064e7aa"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const nameIn = document.getElementById("name");
const emailIn = document.getElementById("email");
const messageIn = document.getElementById("message");
const sendBtn = document.getElementById("sendTicketBtn");
const ticketsList = document.getElementById("ticketsList");

// INVIA TICKET
sendBtn.onclick = async () => {
  const name = nameIn.value.trim();
  const email = emailIn.value.trim();
  const message = messageIn.value.trim();
  if(!name || !email || !message){ alert("Compila tutti i campi"); return; }
  const ticketRef = ref(db,"tickets");
  await push(ticketRef,{name,email,message,status:"in attesa",editable:true});
  nameIn.value=""; emailIn.value=""; messageIn.value="";
  alert("Ticket inviato!");
};

// CARICAMENTO TICKET UTENTE
async function loadUserTickets(){
  ticketsList.innerHTML="";
  const snap = await get(ref(db,"tickets"));
  if(!snap.exists()){ ticketsList.innerHTML="<p>Nessun ticket presente</p>"; return; }
  const data = snap.val();
  Object.entries(data).forEach(([id,t])=>{
    if(t.email){ // mostra solo ticket dell'utente se vuoi filtrare, qui si mostra tutto
      let commentsHtml="";
      if(t.comments){
        Object.values(t.comments).forEach(c=>{
          commentsHtml+=`<div class="comment">${c}</div>`;
        });
      }
      const div=document.createElement("div");
      div.className="ticketItem";
      div.innerHTML=`
        <strong>Ticket #${id}</strong><br>
        <strong>Nome:</strong> ${t.name} | <strong>Email:</strong> ${t.email}<br>
        <strong>Messaggio:</strong> ${t.message}<br>
        <strong>Stato:</strong> ${t.status}<br>
        ${commentsHtml}
      `;
      ticketsList.appendChild(div);
    }
  });
}

// LIVE UPDATE
onValue(ref(db,"tickets"),()=>{ loadUserTickets(); });
</script>
</body>
</html>
