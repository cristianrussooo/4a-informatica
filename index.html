<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4A Informatica</title>
  <style>
    :root {
      --bg-light: #f6f8fa;
      --bg-dark: #0f172a;
      --text-light: #0f172a;
      --text-dark: #f6f8fa;
      --accent: #0078ff;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: background 0.4s, color 0.4s;
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    .container {
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      font-size: 2em;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .mystery-button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(0, 120, 255, 0.3);
    }

    .mystery-button:hover {
      background: #005ecc;
      box-shadow: 0 0 15px rgba(0, 120, 255, 0.5);
    }

    .toggle-theme {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.3em;
      cursor: pointer;
      color: inherit;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.3em; }
      .mystery-button { padding: 10px 20px; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <button class="toggle-theme" id="themeToggle">☀️</button>

  <div class="container">
    <h1>Ciao 👋</h1>
    <p>Benvenuto nella home.</p>
    <button class="mystery-button" id="enterButton">Entra</button>
  </div>

  <script>
    // Rileva preferenza utente
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const body = document.body;
    const toggle = document.getElementById("themeToggle");

    if (prefersDark) body.classList.add("dark");

    // Cambia tema manualmente
    toggle.addEventListener("click", () => {
      body.classList.toggle("dark");
      toggle.textContent = body.classList.contains("dark") ? "🌙" : "☀️";
    });

    // Effetto "misterioso" del bottone
    document.getElementById("enterButton").addEventListener("click", () => {
      // piccolo effetto prima del redirect
      document.querySelector(".container").style.opacity = "0";
      setTimeout(() => {
        window.location.href = "/orario.html";
      }, 600);
    });
  </script>
</body>
</html>
