<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat 4A Informatica</title>
<style>
:root {
  --primary:#1d4ed8; --danger:#ef4444; --success:#22c55e; --bg:#f4f5f7; --panel:#fff; --text:#111; --accent:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
main{flex:1;display:flex;gap:16px;padding:16px;}
.col{background:var(--panel);border-radius:12px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.1);}
#left{width:300px;display:flex;flex-direction:column;gap:12px;}
#right{flex:1;display:flex;flex-direction:column;}
input,textarea,button{font-size:14px;border-radius:8px;padding:8px;}
input,textarea{width:100%;border:1px solid #ccc;background:transparent;}
button{border:none;cursor:pointer;color:#fff;background:var(--accent);}
#chatArea{flex:1;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--panel);}
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:70%;padding:8px 12px;border-radius:12px;background:#eef2ff;position:relative;}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;}
.msg.admin{border:2px solid var(--danger);}
.meta{font-size:12px;color:gray;margin-bottom:4px;}
#sendRow{display:flex;gap:8px;padding-top:8px;}
#sendRow input[type="text"]{flex:1;}
#toastContainer{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:9999;}
.toast{background:var(--panel);padding:8px 12px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);}
#adminPanel{display:none;margin-top:16px;padding:12px;border:1px solid #ccc;border-radius:8px;display:flex;flex-direction:column;gap:8px;}
.pendingMsg{font-size:14px;color:var(--primary);margin-top:12px;}
</style>
</head>
<body>
<header>
  <h1>Chat 4A Informatica</h1>
</header>
<main>
  <section id="left" class="col">
    <div id="authBox">
      <h3>Login / Registrazione</h3>
      <input id="username" placeholder="Nome utente">
      <input id="password" type="password" placeholder="Password">
      <button id="btnLogin">Accedi / Registrati</button>
    </div>
    <div style="margin-top:12px">
      <strong>Utente corrente:</strong>
      <div id="loggedAs">Non connesso</div>
      <button id="btnLogout" style="background:var(--danger);margin-top:6px">Esci</button>
    </div>
    <div id="adminPanel">
      <h3>Strumenti Admin</h3>
      <input id="targetUser" placeholder="Nome utente">
      <button id="btnMute">Muta</button>
      <button id="btnUnmute">Smutare</button>
      <button id="btnBlock">Oscura chat</button>
      <button id="btnUnblock">Rendi visibile</button>
      <button id="btnClear" style="background:var(--danger)">Svuota chat</button>
      <input id="notifyUser" placeholder="Utente destinatario">
      <input id="notifyMsg" placeholder="Messaggio notifica">
      <button id="btnNotify">Invia notifica</button>
      <h4>Registrazioni in attesa</h4>
      <div id="pendingList"></div>
    </div>
  </section>

  <section id="right" class="col">
    <div id="chatArea">
      <div id="messages"></div>
      <div id="sendRow">
        <input id="msgInput" type="text" placeholder="Scrivi un messaggio...">
        <button id="sendBtn">Invia</button>
      </div>
      <div id="pendingNotice" class="pendingMsg"></div>
    </div>
  </section>
</main>
<div id="toastContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, remove, get, update, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBj1gIrPyg7r3CGXn7QdUNN6WqU-X93ZeA",
  authDomain: "classe4a-game.firebaseapp.com",
  databaseURL: "https://classe4a-game-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "classe4a-game",
  storageBucket: "classe4a-game.appspot.com",
  messagingSenderId: "558916476831",
  appId: "1:558916476831:web:88bcc4aa4aeb092064e7aa"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ELEMENTI DOM */
const usernameIn=document.getElementById("username");
const passwordIn=document.getElementById("password");
const btnLogin=document.getElementById("btnLogin");
const btnLogout=document.getElementById("btnLogout");
const loggedAs=document.getElementById("loggedAs");
const msgInput=document.getElementById("msgInput");
const sendBtn=document.getElementById("sendBtn");
const messagesEl=document.getElementById("messages");
const adminPanel=document.getElementById("adminPanel");
const btnMute=document.getElementById("btnMute");
const btnUnmute=document.getElementById("btnUnmute");
const btnBlock=document.getElementById("btnBlock");
const btnUnblock=document.getElementById("btnUnblock");
const btnClear=document.getElementById("btnClear");
const notifyUser=document.getElementById("notifyUser");
const notifyMsg=document.getElementById("notifyMsg");
const btnNotify=document.getElementById("btnNotify");
const targetUser=document.getElementById("targetUser");
const toastContainer=document.getElementById("toastContainer");
const pendingList=document.getElementById("pendingList");
const pendingNotice=document.getElementById("pendingNotice");

let currentUser=null;

/* TOAST */
function showToast(title,text,timeout=4000){
  const t=document.createElement("div"); t.className="toast";
  t.innerHTML=`<strong>${title}</strong><div>${text}</div>`;
  toastContainer.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),400)},timeout);
}

/* LOGIN / REGISTRAZIONE */
btnLogin.onclick=async()=>{
  const username=usernameIn.value.trim();
  const password=passwordIn.value.trim();
  if(!username||!password){ alert("Inserisci credenziali"); return; }

  const userRef=ref(db,"users/"+username);
  const snap=await get(userRef);
  if(!snap.exists()){
    // NUOVA REGISTRAZIONE
    await update(userRef,{password,role:"user",muted:false,blocked:false,status:"pending"});
    currentUser={username,role:"user",muted:false,blocked:false,status:"pending"};
    pendingNotice.textContent="Registrazione inviata, in attesa di approvazione admin.";
    showToast("Registrazione","Richiesta inviata. Attendi approvazione admin.");
    // Notifica all'admin
    await push(ref(db,"pendingRegistrations"),{user:username,time:Date.now()});
  } else {
    const data=snap.val();
    if(data.password!==password){ alert("Password errata"); return; }
    currentUser={username,role:data.role,muted:data.muted,blocked:data.blocked,status:data.status||"active"};
    if(currentUser.status==="pending"){
      pendingNotice.textContent="La tua registrazione è in attesa di approvazione admin.";
      showToast("Attesa","Registrazione in attesa di approvazione admin.");
    } else pendingNotice.textContent="";
  }

  loggedAs.textContent=`${currentUser.username} [${currentUser.role}]`;

  // MOSTRA PANEL ADMIN SOLO PER ADMIN
  adminPanel.style.display=currentUser.role==="admin"?"flex":"none";

  // NOTIFICHE LIVE
  const notifRef=ref(db,"notifications/"+currentUser.username);
  onChildAdded(notifRef,(snap)=>{
    const n=snap.val();
    showToast("Notifica",n.message);
    remove(ref(db,"notifications/"+currentUser.username+"/"+snap.key));
  });

  // CARICAMENTO REGISTRAZIONI PENDING PER ADMIN
  if(currentUser.role==="admin"){
    const pendingRef=ref(db,"pendingRegistrations");
    onChildAdded(pendingRef,(snap)=>{
      const p=snap.val();
      const div=document.createElement("div");
      div.textContent=p.user;
      const acceptBtn=document.createElement("button"); acceptBtn.textContent=" Accetta "; acceptBtn.style.backgroundColor="var(--success)";
      const rejectBtn=document.createElement("button"); rejectBtn.textContent=" Rifiuta "; rejectBtn.style.backgroundColor="var(--danger)";
      const suspendBtn=document.createElement("button"); suspendBtn.textContent=" Metti in attesa "; suspendBtn.style.backgroundColor="var(--danger)";
      acceptBtn.onclick=async()=>{
        await update(ref(db,"users/"+p.user),{status:"active"});
        await remove(ref(db,"pendingRegistrations/"+snap.key));
        await push(ref(db,"notifications/"+p.user),{message:"Registrazione approvata. Ricarica la pagina accedendo e potrai scrivere.",time:Date.now()});
      };
      rejectBtn.onclick=async()=>{
        await remove(ref(db,"users/"+p.user));
        await remove(ref(db,"pendingRegistrations/"+snap.key));
        await push(ref(db,"notifications/"+p.user),{message:"Registrazione rifiutata dall'admin.",time:Date.now()});
      };
      suspendBtn.onclick=async()=>{
        await update(ref(db,"users/"+p.user),{status:"suspend"});
        await push(ref(db,"notifications/"+p.user),{message:"Un admin ha messo in sospensione il tuo account per sottoporlo ad un'ulteriore revisione. Attendi che venga revisionato.",time:Date.now()});
      };
      div.appendChild(acceptBtn); div.appendChild(rejectBtn); div.appendChild(suspendBtn);
      pendingList.appendChild(div);
    });
  }
};

/* LOGOUT */
btnLogout.onclick=()=>{ 
  currentUser=null; 
  loggedAs.textContent="Non connesso"; 
  adminPanel.style.display="none"; 
  pendingNotice.textContent="";
};

/* INVIO MESSAGGI TESTUALI */
sendBtn.onclick=async()=>{
  if(!currentUser){ alert("Devi fare login"); return; }
  if(currentUser.muted||currentUser.blocked){ alert("Non puoi scrivere in chat!"); return; }
  if(currentUser.status==="pending"){ alert("Registrazione non approvata"); return; }
  const txt=msgInput.value.trim();
  if(!txt) return;
  await push(ref(db,"chatGeneral/messages"),{
    user:currentUser.username,
    role:currentUser.role,
    text:txt,
    time:Date.now()
  });
  msgInput.value="";
};

/* CARICAMENTO MESSAGGI */
const messagesRef=ref(db,"chatGeneral/messages");
onChildAdded(messagesRef,(snap)=>{
  const m=snap.val();
  const div=document.createElement("div");
  div.className="msg"+(m.user===currentUser?.username?" me":"")+(m.role==="admin"?" admin":"");
  div.innerHTML=`<div class="meta"><strong>${m.user}${m.role==="admin"?" [ADMIN]":""}</strong> • ${new Date(m.time).toLocaleTimeString()}</div><div>${m.text}</div>`;

  if(currentUser?.role==="admin"){
    const delBtn=document.createElement("button");
    delBtn.textContent="Elimina";
    delBtn.style.cssText="position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;padding:2px 6px;font-size:11px;border-radius:4px;border:0;cursor:pointer";
    delBtn.onclick=async()=>{ await remove(ref(db,"chatGeneral/messages/"+snap.key)); showToast("Admin","Messaggio eliminato"); };
    div.appendChild(delBtn);
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop=messagesEl.scrollHeight;
});

/* FUNZIONI ADMIN */
btnClear.onclick=async()=>{ if(currentUser?.role==="admin" && confirm("Svuotare tutta la chat?")) await remove(ref(db,"chatGeneral/messages")); };
btnMute.onclick=()=>{ if(currentUser?.role==="admin" && targetUser.value) update(ref(db,"users/"+targetUser.value),{muted:true}); };
btnUnmute.onclick=()=>{ if(currentUser?.role==="admin" && targetUser.value) update(ref(db,"users/"+targetUser.value),{muted:false}); };
btnBlock.onclick=()=>{ if(currentUser?.role==="admin" && targetUser.value) update(ref(db,"users/"+targetUser.value),{blocked:true}); };
btnUnblock.onclick=()=>{ if(currentUser?.role==="admin" && targetUser.value) update(ref(db,"users/"+targetUser.value),{blocked:false}); };
btnNotify.onclick=async()=>{ 
  if(currentUser?.role!=="admin") return;
  const u=notifyUser.value.trim();
  const m=notifyMsg.value.trim();
  if(!u||!m) return;
  await push(ref(db,"notifications/"+u),{message:m,time:Date.now()});
  showToast("Admin","Notifica inviata a "+u);
};
</script>
</body>
</html>
